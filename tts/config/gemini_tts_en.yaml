  description: "Local Qwen3-TTS config (English)"
  last_updated: "2026-02-14"

# Host/Analyst instructions (English broadcast style)
instructions:
  speaker1: |
    Output audio only. Speed=1.02, Volume=1.00. U.S. stock market close podcast style: neutral, serious, and broadcast-professional. Keep emotion restrained (around 10-15%), avoid hype or dramatic delivery. Speak with steady pacing and clear articulation. The Host leads the episode, sets the agenda, and transitions topics with authority.
  speaker2: |
    Output audio only. Speed=1.02, Volume=1.00. U.S. stock market close podcast style: neutral, serious, and analytical. Keep emotion restrained (around 10-15%), avoid hype or dramatic delivery. Maintain a factual tone and stable rhythm. The Analyst explains market moves, data-driven context, and key drivers (earnings, macro data, Fed policy) with concise takeaways.

# generation temperature
temperature: 0.4

# Voice/style hints for Qwen speakers
voices:
  speaker1: Aiden
  speaker2: Ryan

# Request timeout (seconds)
timeout_seconds: 300

# Max parallel requests (local stability first)
max_parallel_requests: 1

# Batch cooldown (seconds)
# Wait this long after each batch to reduce local thermal spikes
batch_timeout_seconds: 5

# Gap settings (seconds)
# - common_gap_seconds: Default silence between turns in the same chapter
# - chapter_gap_seconds: Longer silence at chapter boundaries
common_gap_seconds: 0.5
chapter_gap_seconds: 1
