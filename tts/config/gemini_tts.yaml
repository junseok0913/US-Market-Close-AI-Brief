meta:
  description: "Local Qwen3-TTS config (Korean)"
  last_updated: "2026-02-14"

# 진행자/해설자별 instruction (single-speaker turn 단위로 사용할 예정)
instructions:
  speaker1: |
    Output audio only. Speed=1.02, Volume=1.00. Korean financial news anchor style. Serious, calm, and authoritative. Keep emotional expression very low (0-5%). Do not sound excited, playful, or dramatic. Use steady pacing with short punctuation pauses only. Do not stretch sentence endings or add trailing tone. End each sentence clearly and promptly with a firm neutral cadence. The Host leads agenda and transitions with concise broadcast phrasing.
  speaker2: |
    Output audio only. Speed=1.02, Volume=1.00. Korean financial analyst broadcast style. Serious, factual, and measured. Keep emotional expression very low (0-5%). Avoid hype and dramatic emphasis. Maintain stable rhythm with short punctuation pauses only. Do not stretch sentence endings or add trailing tone. Explain market moves, macro context, and key drivers with concise takeaways and risk notes.

# generation temperature
temperature: 0.3

# 진행자/해설자별 voice/style hint (Qwen speakers)
voices:
  speaker1: Sohee
  speaker2: Sohee

# 요청 타임아웃(초) - 로컬 모델 첫 로드가 길 수 있어 기본값을 높게 유지
timeout_seconds: 300

# 동시 요청 수 (로컬 M4 발열/메모리 안정성을 위해 1 권장)
max_parallel_requests: 1

# 배치 쿨다운(초)
# - 로컬 연속 생성시 발열 완화를 위해 배치 간 짧은 휴식
batch_timeout_seconds: 5

# gap 설정(초)
# - common_gap_seconds: 같은 챕터 내에서 turn 사이에 넣을 기본 gap
# - chapter_gap_seconds: 챕터 경계에서는 common gap 대신 이 값으로 대체
common_gap_seconds: 0.18
chapter_gap_seconds: 0.35
