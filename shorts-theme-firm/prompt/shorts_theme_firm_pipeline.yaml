        {{"name": "company_3", "ticker": "{target_ticker}", "text": "risk 관점 문단"}},
        {{"name": "company_4", "ticker": "{target_ticker}", "text": "sentiment 관점 문단"}},
        {{"name": "closing", "text": "구독과 좋아요 부탁드립니다."}}
      ],
      "script": "string",
      "sources": [
        {{"type":"article","pk":"...","title":"..."}},
        {{"type":"chart","ticker":"...","start_date":"YYYY-MM-DD","end_date":"YYYY-MM-DD"}}
      ],
      "metadata": {{
