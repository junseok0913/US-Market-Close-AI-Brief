name: Daily Stock Podcast Automation

on:
  # Temporarily disabled - only manual runs allowed
  # push:
  #   branches:
  #     - youtube # 예: develop 또는 feat/podcast
  #schedule:
    # 매일 평일(월-금) UTC 21:30 (한국 시간 오전 6:30, 미국 장 마감 후)
  #  - cron: '30 21 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 (테스트용)

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Set Date Variable
        id: date
        run: |
          # 미국 동부 시간 기준 현재 날짜 (YYYYMMDD) 계산
          # GitHub Runner는 UTC 기준이므로 -5시간(EST) 적용
          CURRENT_DATE=$(date -d '-5 hours' +'%Y%m%d')
          echo "TARGET_DATE=$CURRENT_DATE" >> $GITHUB_ENV
          echo "Target Date is $CURRENT_DATE"

      - name: Cache Podcast Data
        id: cache-podcast
        uses: actions/cache@v4
        with:
          path: podcast/${{ env.TARGET_DATE }}
          key: podcast-data-${{ env.TARGET_DATE }}

      - name: Generate Podcast Script (Orchestrator)
        if: steps.cache-podcast.outputs.cache-hit != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_AWS_ACCESS_KEY_ID: ${{ secrets.NEWS_AWS_ACCESS_KEY_ID }}
          NEWS_AWS_SECRET_ACCESS_KEY: ${{ secrets.NEWS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "ap-northeast-2"
        run: |
          echo "Generating script for $TARGET_DATE..."
          # 예시 티커: SPY QQQ NVDA TSLA (원하는 티커로 수정 가능)
          uv run python orchestrator.py $TARGET_DATE -t LMT

      - name: Upload Script Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-script-${{ env.TARGET_DATE }}
          path: podcast/${{ env.TARGET_DATE }}

      - name: Generate Audio (TTS Korean)
        if: steps.cache-podcast.outputs.cache-hit != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Generating Korean Audio for $TARGET_DATE..."
          uv run python -m tts.src.tts $TARGET_DATE --lang ko

      - name: Upload Korean Audio Artifact
        if: success() || steps.cache-podcast.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: podcast-audio-ko-${{ env.TARGET_DATE }}
          path: podcast/${{ env.TARGET_DATE }}

      - name: Generate Audio (TTS English)
        if: steps.cache-podcast.outputs.cache-hit != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Generating English Audio for $TARGET_DATE..."
          uv run python -m tts.src.tts $TARGET_DATE --lang en

      - name: Upload English Audio Artifact
        if: success() || steps.cache-podcast.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: podcast-audio-en-${{ env.TARGET_DATE }}
          path: podcast/${{ env.TARGET_DATE }}

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-2" # 버킷 리전에 맞춰 수정 필요
          BUCKET_NAME: "podcast-daily-stock"
        run: |
          echo "Uploading results to S3..."
          # MP3와 metadata만 업로드 (한국어/영어)
          aws s3 cp podcast/$TARGET_DATE/ko/$TARGET_DATE.mp3 s3://$BUCKET_NAME/$TARGET_DATE/ko/$TARGET_DATE.mp3
          aws s3 cp podcast/$TARGET_DATE/ko/metadata.json s3://$BUCKET_NAME/$TARGET_DATE/ko/metadata.json
          aws s3 cp podcast/$TARGET_DATE/en/$TARGET_DATE.mp3 s3://$BUCKET_NAME/$TARGET_DATE/en/$TARGET_DATE.mp3
          aws s3 cp podcast/$TARGET_DATE/en/metadata.json s3://$BUCKET_NAME/$TARGET_DATE/en/metadata.json
          
      - name: Update RSS Feed (Korean)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-2"
          BUCKET_NAME: "podcast-daily-stock"
          CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}
        run: |
          echo "Updating Korean RSS Feed..."
          uv run python AWS/scripts/update_podcast_feed.py --lang ko

      - name: Update RSS Feed (English)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-2"
          BUCKET_NAME: "podcast-daily-stock"
          CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}
        run: |
          echo "Updating English RSS Feed..."
          uv run python AWS/scripts/update_podcast_feed.py --lang en

      - name: Invalidate CloudFront Cache
        # CLOUDFRONT_DISTRIBUTION_ID가 설정되어 있으면 실행됨
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-2"
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          echo "Invalidating CloudFront Cache for RSS feeds..."
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/podcast.xml" "/podcast_en.xml"



      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git pull --rebase
          git add podcast/
          git commit -m "Add podcast data for $TARGET_DATE" || echo "No changes to commit"
          git push

