name: Podcast Listener Analytics

on:
  schedule:
    # Weekly run (Tuesday UTC): generate previous full Mon-Sun window.
    - cron: "0 1 * * 2"
  workflow_dispatch:
    inputs:
      from:
        description: "Report start date (YYYY-MM-DD)"
        required: false
        type: string
      to:
        description: "Report end date (YYYY-MM-DD)"
        required: false
        type: string
      timezone:
        description: "Report timezone"
        required: false
        default: "US/Eastern"
        type: string
      include_shorts:
        description: "Include shorts URI pattern"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  listener-analytics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Resolve report window
        id: window
        env:
          INPUT_FROM: ${{ github.event.inputs.from }}
          INPUT_TO: ${{ github.event.inputs.to }}
          INPUT_TZ: ${{ github.event.inputs.timezone }}
          INPUT_INCLUDE_SHORTS: ${{ github.event.inputs.include_shorts }}
        run: |
          set -euo pipefail

          DATE_FROM="${INPUT_FROM:-}"
          DATE_TO="${INPUT_TO:-}"
          TZ_NAME="${INPUT_TZ:-US/Eastern}"
          INCLUDE_SHORTS="${INPUT_INCLUDE_SHORTS:-true}"

          if [[ -n "$DATE_FROM" && -n "$DATE_TO" ]]; then
            echo "Using manual date range: $DATE_FROM ~ $DATE_TO"
          elif [[ -n "$DATE_FROM" || -n "$DATE_TO" ]]; then
            echo "Both 'from' and 'to' must be provided together." >&2
            exit 1
          else
            WINDOW="$(python -c "from datetime import datetime, timedelta, timezone; today = datetime.now(timezone.utc).date(); days_since_sunday = (today.weekday() + 1) % 7 or 7; date_to = today - timedelta(days=days_since_sunday); date_from = date_to - timedelta(days=6); print(f'{date_from.isoformat()} {date_to.isoformat()}')")"
            DATE_FROM="${WINDOW%% *}"
            DATE_TO="${WINDOW##* }"
            echo "Auto-selected date range: $DATE_FROM ~ $DATE_TO"
          fi

          echo "date_from=$DATE_FROM" >> "$GITHUB_OUTPUT"
          echo "date_to=$DATE_TO" >> "$GITHUB_OUTPUT"
          echo "timezone=$TZ_NAME" >> "$GITHUB_OUTPUT"
          echo "include_shorts=$INCLUDE_SHORTS" >> "$GITHUB_OUTPUT"

      - name: Generate listener report
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CLOUDFRONT_LOG_BUCKET: ${{ secrets.CLOUDFRONT_LOG_BUCKET }}
          CLOUDFRONT_LOG_PREFIX: ${{ secrets.CLOUDFRONT_LOG_PREFIX }}
          CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}
        run: |
          set -euo pipefail
          ARGS=(
            --from "${{ steps.window.outputs.date_from }}"
            --to "${{ steps.window.outputs.date_to }}"
            --tz "${{ steps.window.outputs.timezone }}"
            --output-dir feedback/reports
            --write-json
          )
          if [[ "${{ steps.window.outputs.include_shorts }}" == "true" ]]; then
            ARGS+=(--include-shorts)
          fi
          uv run python AWS/scripts/generate_listener_report.py "${ARGS[@]}"

      - name: Upload listener report artifact
        uses: actions/upload-artifact@v4
        with:
          name: listener-report-${{ steps.window.outputs.date_from }}-${{ steps.window.outputs.date_to }}
          path: |
            feedback/reports/weekly_listener_report_${{ steps.window.outputs.date_from }}_${{ steps.window.outputs.date_to }}.md
            feedback/reports/data/listener_daily_${{ steps.window.outputs.date_from }}_${{ steps.window.outputs.date_to }}.csv
            feedback/reports/data/listener_summary_${{ steps.window.outputs.date_from }}_${{ steps.window.outputs.date_to }}.json
          if-no-files-found: error

      - name: Commit report changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feedback/reports

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "Add listener analytics report (${{ steps.window.outputs.date_from }} to ${{ steps.window.outputs.date_to }})"
          git push
